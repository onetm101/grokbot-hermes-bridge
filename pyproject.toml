[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "grokbot-hermes-bridge"
version = "0.1.0"
description = "Self-hosted OAuth MCP bridge from Grok Bot to Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Supersocks" }]
dependencies = [
  "mcp>=1.29,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["detect-secrets>=1.5,<2"]

[project.urls]
Homepage = "https://github.com/iamsupersocks/grokbot-hermes-bridge"
Repository = "https://github.com/iamsupersocks/grokbot-hermes-bridge"

[tool.setuptools.packages.find]
include = ["hermes_gateway*"]
